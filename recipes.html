<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NutriGo — Receitas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><div class="logo">NG</div><div><h1>NutriGo</h1><p class="muted">Biblioteca de receitas nutricionais</p></div></div>
      <nav class="nav-links">
        <a class="btn" href="index.html">Home</a><a class="btn" href="planner.html">Plano</a><a class="btn active-link" href="recipes.html">Receitas</a><a class="btn" href="profile.html">Perfil</a><a class="btn" href="premium.html">Premium</a>
      </nav>
      <div class="auth-area"><button id="googleLoginBtn" class="btn">Entrar com Google</button><button id="logoutBtn" class="btn hidden">Terminar sessão</button><span id="userBadge" class="badge hidden"></span></div>
    </header>

    <div id="globalMessage" class="notice hidden"></div>

    <main class="page">
      <section class="section">
        <h3>Receitas (120 variações)</h3>
        <p class="muted">Fotos coerentes por tipo de refeição e filtro por snack incluído.</p>
        <div class="card filter-row">
          <input id="searchInput" type="search" placeholder="Pesquisar receita..." />
          <select id="mealTypeFilter">
            <option value="">Todas</option>
            <option value="pequeno-almoco">Pequeno-almoço</option>
            <option value="almoco">Almoço</option>
            <option value="jantar">Jantar</option>
            <option value="snack">Snack</option>
          </select>
          <button id="clearFilters" class="btn" type="button">Limpar</button>
        </div>
        <div id="recipesGrid" class="recipes"></div>
      </section>
    </main>

    <footer>&copy; 2025 NutriGo.</footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
